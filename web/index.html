<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebDash</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--bg:#0b0d10;--panel:#12151a;--panel2:#171b21;--border:#252a33;--text:#f4f6f8;--muted:#8d96a5;--good:#a5f3c1;--bad:#ffb4b4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% -10%,#1a2230 0,transparent 36%),var(--bg);color:var(--text)}
.wrap{width:min(1440px,100%);margin:auto;padding:28px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}.heading{display:flex;gap:14px;align-items:center}h1{font-size:clamp(28px,4vw,46px);letter-spacing:-.04em;margin:2px 0 0}.status{font-size:13px;color:var(--muted);margin-top:7px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(18,21,26,.85);padding:8px;border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(12px)}input{width:190px;background:#0d1014;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none}button{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;background:#f4f6f8;color:#0b0d10}.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.tile{position:relative;overflow:hidden;min-height:170px;padding:22px;border-radius:24px;border:1px solid var(--border);background:linear-gradient(145deg,var(--panel2),var(--panel));box-shadow:0 18px 45px rgba(0,0,0,.18)}.tile::after{content:"";position:absolute;inset:auto -60px -70px auto;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.025)}.tile.off{opacity:.78}.label{font-size:16px;font-weight:700;letter-spacing:-.01em}.source{font-size:12px;color:var(--muted);margin-top:4px;min-height:18px}.value{font-variant-numeric:tabular-nums;font-size:clamp(36px,5vw,58px);line-height:1;font-weight:760;letter-spacing:-.055em;margin-top:30px;white-space:nowrap}.unit{font-size:.44em;font-weight:650;letter-spacing:-.02em;color:var(--muted);margin-left:7px}.boolean .value{font-size:42px}.boolean.on .value{color:var(--good)}.boolean.off .value{color:var(--bad)}.empty{grid-column:1/-1;display:grid;place-items:center;text-align:center;min-height:260px;color:var(--muted)}.offline{outline:1px solid #784444}.offline::before{content:"offline";position:absolute;top:16px;right:16px;font-size:11px;color:var(--bad)}
@media(max-width:620px){.wrap{padding:18px}.controls{width:100%}.controls input{flex:1;width:auto}.tile{min-height:145px}.value{margin-top:24px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <div class="eyebrow">Homey Dashboard Bridge</div>
      <h1 id="title">WebDash</h1>
      <div id="status" class="status">Connecting…</div>
    </div>
    <div class="controls">
      <input id="homey" autocomplete="off" spellcheck="false" placeholder="192.168.17.137" aria-label="Homey IP address">
      <button id="connect">Connect</button>
      <button id="fullscreen" class="ghost" title="Toggle fullscreen">Fullscreen</button>
    </div>
  </header>
  <main id="grid" class="grid"></main>
</div>
<script src="app.js"></script>
</body>
</html>

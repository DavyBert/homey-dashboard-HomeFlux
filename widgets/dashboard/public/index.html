<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/homey.js"></script>
<style>
:root{
  color-scheme:light dark;
  --gap:10px;
  --radius:20px;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  color:var(--homey-text-color,#fff);
}
body{padding:8px}
.frame{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  overflow:visible;
  --energy-border:rgba(255,255,255,.18);
  --energy-shadow:0 10px 28px rgba(0,0,0,.18);
  --energy-overlay:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.08));
  --callout-bg:rgba(12,17,23,.58);
  --callout-border:rgba(255,255,255,.28);
  --callout-shadow:0 7px 20px rgba(0,0,0,.30);
  --callout-text:#fff;
  --callout-muted:#d2d7df;
  --callout-text-shadow:0 1px 2px rgba(0,0,0,.72);
  --tile-bg:rgba(24,30,38,.18);
  --tile-border:rgba(255,255,255,.10);
  --tile-shadow:0 2px 8px rgba(0,0,0,.06);
  --tile-subtitle-opacity:.5;
}
.frame[data-theme="light"]{
  --energy-border:rgba(255,255,255,.82);
  --energy-shadow:0 10px 24px rgba(96,104,132,.10), 0 2px 8px rgba(96,104,132,.05);
  --energy-overlay:linear-gradient(180deg,rgba(255,255,255,.08),rgba(244,241,248,.15));
  --callout-bg:rgba(255,255,255,.92);
  --callout-border:rgba(255,255,255,.88);
  --callout-shadow:0 5px 14px rgba(86,91,116,.08), 0 1px 4px rgba(86,91,116,.04);
  --callout-text:#20232b;
  --callout-muted:#626875;
  --callout-text-shadow:none;
  --tile-bg:rgba(255,255,255,.96);
  --tile-border:rgba(255,255,255,.82);
  --tile-shadow:0 6px 14px rgba(96,104,132,.06), 0 2px 5px rgba(96,104,132,.04);
  --tile-subtitle-opacity:.46;
}

.frame[data-theme="light"] .solar .value,
.frame[data-theme="light"] .battery .value,
.frame[data-theme="light"] .battery .sub.status-charge,
.frame[data-theme="light"] .batteryPower.power-charge,
.frame[data-theme="light"] .grid .value.grid-export,
.frame[data-theme="light"] .grid .sub.grid-export{color:#2fae23}
.frame[data-theme="light"] .grid .value,
.frame[data-theme="light"] .ev .value,
.frame[data-theme="light"] .battery .sub.status-discharge,
.frame[data-theme="light"] .batteryPower.power-discharge,
.frame[data-theme="light"] .grid .value.grid-import,
.frame[data-theme="light"] .grid .sub.grid-import{color:#1688dd}
.energy{
  position:relative;
  width:100%;
  aspect-ratio:7/5;
  overflow:hidden;
  border-radius:var(--radius);
  background:#17212a center/cover no-repeat;
  border:1px solid var(--energy-border);
  box-shadow:var(--energy-shadow);
  isolation:isolate;
  transition:border-color .28s ease, box-shadow .28s ease, background-color .28s ease;
}
.energy:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:var(--energy-overlay);
  z-index:1;
  transition:background .28s ease;
}
.flow-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.flow-overlay{z-index:2.4;opacity:1;transition:opacity .25s ease}
.flow-overlay path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s ease,stroke .25s ease}
.flow-overlay .flow-glow{stroke-width:2.8;opacity:.28;filter:blur(.9px)}
.flow-overlay .flow-core{stroke-width:1.15;stroke-dasharray:3.2 2.2;animation:flowMove 1.15s linear infinite}
.flow-overlay.flow-hidden{opacity:0}
.flow-overlay.motion-reverse .flow-core{animation-direction:reverse}
.flow-overlay.standby .flow-core,.flow-overlay.standby .flow-glow{stroke-dasharray:3.2 2.2;stroke-dashoffset:0;animation:none}
.flow-overlay.standby-blue .flow-glow,.flow-overlay.standby-blue .flow-core{stroke:#49a4ff}
.flow-overlay.standby-green .flow-glow,.flow-overlay.standby-green .flow-core{stroke:#70e93f}
#solarFlowOverlay.standby-greenblue .flow-glow,#solarFlowOverlay.standby-greenblue .flow-core{stroke:url(#solarStandbyGreenBlue)}
#batteryFlowOverlay.standby-greenblue .flow-glow,#batteryFlowOverlay.standby-greenblue .flow-core{stroke:url(#batteryStandbyGreenBlue)}
#gridFlowOverlay.standby-greenblue .flow-glow,#gridFlowOverlay.standby-greenblue .flow-core{stroke:url(#gridStandbyGreenBlue)}
.flow-overlay.standby.standby-blink .flow-core{animation:standbyBlinkCore var(--line-blink-interval,2.4s) ease-in-out infinite}
.flow-overlay.standby.standby-blink .flow-glow{animation:standbyBlinkGlow var(--line-blink-interval,2.4s) ease-in-out infinite}
.flow-overlay.solar-active .flow-glow,.flow-overlay.solar-active .flow-core{stroke:#70e93f}
.flow-overlay.charge .flow-glow,.flow-overlay.charge .flow-core{stroke:#70e93f}
.flow-overlay.discharge .flow-glow,.flow-overlay.discharge .flow-core{stroke:#49a4ff}
.flow-overlay.grid-import .flow-glow,.flow-overlay.grid-import .flow-core{stroke:#49a4ff}
.flow-overlay.grid-export .flow-glow,.flow-overlay.grid-export .flow-core{stroke:#70e93f}
.flow-overlay.grid-export .flow-core{animation-direction:reverse}
.flow-overlay.ev-grid .flow-glow,.flow-overlay.ev-grid .flow-core{stroke:#49a4ff}
.flow-overlay.ev-solar .flow-glow,.flow-overlay.ev-solar .flow-core{stroke:#70e93f}
#evFlowOverlay.ev-greenblue .flow-glow,#evFlowOverlay.ev-greenblue .flow-core{stroke:url(#evGridGreenBlue)}
@keyframes flowMove{to{stroke-dashoffset:-10.8}}
@keyframes flowBlink{0%,46%{stroke:#49a4ff}54%,100%{stroke:#70e93f}}
@keyframes standbyBlinkCore{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes standbyBlinkGlow{0%,100%{opacity:.28}50%{opacity:.08}}
.callout{
  position:absolute;
  z-index:3;
  padding:9px 11px;
  border-radius:14px;
  background:var(--callout-bg);
  color:var(--callout-text,#fff);
  border:1px solid var(--callout-border);
  box-shadow:var(--callout-shadow);
  backdrop-filter:blur(2px) saturate(1);
  -webkit-backdrop-filter:blur(2px) saturate(1);
  min-width:0;
  overflow:hidden;
  text-shadow:var(--callout-text-shadow);
  transition:background .28s ease, border-color .28s ease, box-shadow .28s ease;
}
.callout-inner{display:block;transform-origin:top left;zoom:var(--widget-text-scale,.9);width:100%}
.kicker{font-size:calc(clamp(7px,2.15vw,11px) * var(--widget-title-scale,1));font-weight:800;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reading{display:flex;gap:4px;align-items:baseline;margin-top:3px;white-space:nowrap;min-width:0;max-width:100%;overflow:visible}
.value{font-size:clamp(18px,5.7vw,34px);font-weight:830;line-height:1}
.unit{font-size:clamp(8px,2.6vw,14px);font-weight:750;opacity:.9}
.sub{font-size:clamp(7px,2.15vw,11px);margin-top:5px;font-weight:680;line-height:1.15}
.solar{left:4.2%;top:5.8%;width:25%}
.grid{right:4.5%;top:5.8%;width:24%}
.battery{left:3.2%;bottom:4.5%;width:22%}
.home{left:39%;top:40%;width:27%}
.ev{right:5.5%;bottom:4.5%;width:23%;transition:opacity .28s ease,transform .28s ease,background .28s ease,border-color .28s ease,box-shadow .28s ease}
.ev.ev-inactive{opacity:0;transform:translateY(6px) scale(.97);pointer-events:none;visibility:hidden}
.component-hidden{display:none!important}
.solar .value{color:#70e93f}
.grid .value,.ev .value{color:#49a4ff}
.battery .value{color:#70e93f}
.battery .sub.status-charge{color:#70e93f}
.battery .sub.status-discharge{color:#49a4ff}
.battery .sub.status-idle{color:var(--callout-muted,#d2d7df)}
.batteryState{font-size:clamp(9px,2.8vw,15px);font-weight:800}
.batteryPower{font-size:clamp(10px,3.2vw,17px);font-weight:820;white-space:nowrap}
.batteryPower.power-charge{color:#70e93f}
.batteryPower.power-discharge{color:#49a4ff}
.batteryPower.power-idle{color:var(--callout-muted,#d2d7df)}
.grid .value.grid-import,.grid .sub.grid-import{color:#49a4ff}
.grid .value.grid-export,.grid .sub.grid-export{color:#70e93f}
.batteryAgo{opacity:.78;font-weight:650;white-space:nowrap}
.extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.extra.hidden{display:none}
.tile{
  padding:12px 13px;
  border-radius:18px;
  background:var(--tile-bg);
  border:1px solid var(--tile-border);
  min-height:84px;
  box-shadow:var(--tile-shadow);
  backdrop-filter:blur(1px) saturate(1);
  -webkit-backdrop-filter:blur(1px) saturate(1);
  transition:background .28s ease,border-color .28s ease,box-shadow .28s ease,opacity .28s ease;
}
.tile-head{display:flex;justify-content:space-between;gap:8px}
.names{min-width:0}
.label{font-size:13px;font-weight:770;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:10px;opacity:var(--tile-subtitle-opacity);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:#aaa;flex:none;margin-top:4px}
.dot.online{background:#52c56c}
.reading2{display:flex;gap:4px;align-items:baseline;margin-top:10px;white-space:nowrap;min-width:0;max-width:100%}
.value2{font-size:25px;font-weight:790;line-height:1}
.unit2{font-size:12px;font-weight:700;opacity:.58}
.boolean .value2{font-size:22px}
.boolean-on .value2{color:#44bf63}
.offline{opacity:.55}
@media(min-width:520px){body{padding:10px}.extra{grid-template-columns:repeat(3,minmax(0,1fr))}.callout{padding:11px 13px}}
@media(min-width:760px){.extra{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:360px){body{padding:6px;--gap:7px;--radius:16px}.callout{padding:6px 7px;border-radius:10px}.battery{width:24%;bottom:4.5%}.home{width:29%;left:37%}.ev{width:24%}.tile{padding:10px;min-height:78px}}

.flow-overlay.standby-yellow .flow-glow,.flow-overlay.standby-yellow .flow-core{stroke:#f7d628}
/* Optional effects retain the existing SVG coordinates and settings palette. */
.flow-overlay .effect-tail,.flow-overlay .effect-head{display:none;fill:none;stroke:var(--effect-stroke,var(--effect-color,#49a4ff));stroke-linecap:round;pointer-events:none}
.flow-overlay .effect-head{fill:none;stroke:#fff;stroke-linecap:round;opacity:.94;filter:drop-shadow(0 0 .7px white)}
.flow-overlay .effect-spark{display:none;stroke:var(--effect-stroke,var(--effect-color,#49a4ff));opacity:.85;filter:drop-shadow(0 0 calc(1.2px * var(--ribbon-glow,1)) var(--effect-color,#49a4ff))}
.flow-overlay[data-effect-style="ribbon"] .effect-spark{display:initial}
.flow-overlay.solar-active,.flow-overlay.charge,.flow-overlay.grid-export,.flow-overlay.ev-solar{--effect-color:#70e93f}
.flow-overlay.discharge,.flow-overlay.grid-import,.flow-overlay.ev-grid{--effect-color:#49a4ff}
#solarFlowOverlay.solar-active[data-pv-color="yellow"]{--effect-color:#f7d628}
#solarFlowOverlay.solar-active[data-pv-color="yellow"] .flow-core,#solarFlowOverlay.solar-active[data-pv-color="yellow"] .flow-glow{stroke:#f7d628}
.frame[data-pv-value-color="yellow"] .solar .value{color:#f7d628}
.frame[data-theme="light"][data-pv-value-color="yellow"] .solar .value{color:#a58100}
.flow-overlay[data-effect-style="ribbon"] .flow-core{stroke-linecap:round;opacity:calc(.3 * var(--ribbon-glow,1));filter:blur(calc(.65px * var(--ribbon-glow,1)))}
.flow-overlay[data-effect-style="ribbon"] .flow-glow{opacity:.28;filter:none;stroke-dasharray:none}
.flow-overlay .effect-tail{filter:drop-shadow(0 0 .6px var(--effect-color,#49a4ff))}
.flow-overlay[data-effect-style="comet"] .flow-core{stroke-dasharray:none;opacity:.2}
.flow-overlay[data-effect-style="comet"] .flow-glow{opacity:0}
.flow-overlay[data-effect-style="comet"] .effect-tail,.flow-overlay[data-effect-style="comet"] .effect-head{display:initial}
/* Standby retains its colour/blink settings while using the selected renderer. */
.flow-overlay.standby-blue{--effect-color:#49a4ff}
.flow-overlay.standby-green{--effect-color:#70e93f}
.flow-overlay.standby-yellow{--effect-color:#f7d628}
#solarFlowOverlay.standby-greenblue{--effect-stroke:url(#solarStandbyGreenBlue)}
#batteryFlowOverlay.standby-greenblue{--effect-stroke:url(#batteryStandbyGreenBlue)}
#gridFlowOverlay.standby-greenblue{--effect-stroke:url(#gridStandbyGreenBlue)}
.flow-overlay.standby.standby-blink:not([data-effect-style="classic"]){animation:standbyBlinkCore var(--line-blink-interval,2.4s) ease-in-out infinite}
.flow-overlay.standby:not([data-effect-style="classic"]) .flow-core,.flow-overlay.standby:not([data-effect-style="classic"]) .flow-glow{animation:none}

</style>
</head>
<body>
<main class="frame" id="frame">
  <section class="energy" id="energy" aria-label="Live energie-overzicht">

    <svg id="solarFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="solarStandbyGreenBlue" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#70e93f"/><stop offset=".48" stop-color="#70e93f"/><stop offset=".52" stop-color="#49a4ff"/><stop offset="1" stop-color="#49a4ff"/></linearGradient></defs>
      <path class="flow-glow" d="M27.0 26.0 L27.0 49.5 L39.0 49.5"/>
      <path class="flow-core" d="M27.0 26.0 L27.0 49.5 L39.0 49.5"/>
    </svg>
    <svg id="batteryFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="batteryStandbyGreenBlue" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#70e93f"/><stop offset=".48" stop-color="#70e93f"/><stop offset=".52" stop-color="#49a4ff"/><stop offset="1" stop-color="#49a4ff"/></linearGradient></defs>
      <path class="flow-glow" d="M46.0 63.5 L46.0 81.3 L35.4 81.3"/>
      <path class="flow-core" d="M46.0 63.5 L46.0 81.3 L35.4 81.3"/>
    </svg>
    <svg id="gridFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="gridStandbyGreenBlue" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#70e93f"/><stop offset=".48" stop-color="#70e93f"/><stop offset=".52" stop-color="#49a4ff"/><stop offset="1" stop-color="#49a4ff"/></linearGradient></defs>
      <path class="flow-glow" d="M75.0 26.0 L75.0 49.5 L63.9 49.5"/>
      <path class="flow-core" d="M75.0 26.0 L75.0 49.5 L63.9 49.5"/>
    </svg>
    <svg id="evFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="evGridGreenBlue" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#70e93f"/><stop offset=".48" stop-color="#70e93f"/><stop offset=".52" stop-color="#49a4ff"/><stop offset="1" stop-color="#49a4ff"/></linearGradient></defs>
      <path class="flow-glow" d="M63.9 56.5 L73.6 56.5 L73.6 75.8"/>
      <path class="flow-core" d="M63.9 56.5 L73.6 56.5 L73.6 75.8"/>
    </svg>
    <div class="callout solar"><div class="callout-inner"><div class="kicker">Zonnepanelen</div><div class="reading"><span class="value" id="solarValue">—</span><span class="unit" id="solarUnit"></span></div><div class="sub">Productie</div></div></div>
    <div class="callout grid"><div class="callout-inner"><div class="kicker">Elektriciteitsnet</div><div class="reading"><span class="value" id="gridValue">—</span><span class="unit" id="gridUnit"></span></div><div class="sub" id="gridStatus">Net</div></div></div>
    <div class="callout battery"><div class="callout-inner"><div class="kicker">Batterij</div><div class="reading"><span class="value" id="batterySocValue">—</span><span class="unit" id="batterySocUnit"></span></div><div class="sub batteryState" id="batteryStatus">—</div><div class="sub batteryPower" id="batteryPower"></div><div class="sub batteryAgo" id="batteryAgo"></div></div></div>
    <div class="callout home"><div class="callout-inner"><div class="kicker">Huisverbruik</div><div class="reading"><span class="value" id="homeValue">—</span><span class="unit" id="homeUnit"></span></div><div class="sub" id="homeStatus">Verbruik</div></div></div>
    <div class="callout ev"><div class="callout-inner"><div class="kicker">Autolader</div><div class="reading"><span class="value" id="evValue">—</span><span class="unit" id="evUnit"></span></div><div class="sub" id="evStatus">Lader</div></div></div>
  </section>
  <section id="extra" class="extra hidden" aria-label="Extra dashboarditems"></section>
</main>
<script>
function onHomeyReady(Homey){
 const $=id=>document.getElementById(id), frame=$('frame'), energyEl=$('energy'), extra=$('extra');
 const tr=(key,tokens)=>Homey.__(key,tokens);
 // BEGIN SHARED EFFECTS
 const effects=(function(){
  'use strict';
  const names=['solar','grid','battery','ev'];
  function normalize(input={}){
    const c=input||{},number=(key,fallback,min,max)=>{const n=c[key];return n!==null&&n!==''&&Number.isFinite(Number(n))?Math.min(max,Math.max(min,Number(n))):fallback;};
    const one=(key,values,fallback)=>values.includes(c[key])?c[key]:fallback;
    const defaults={solar:5000,grid:3500,battery:6000,ev:3600},limits={};
    for(const name of names){const n=Number(c.powerLimits?.[name]);limits[name]=Number.isFinite(n)&&n>0?Math.min(1000000,n):defaults[name];}
    return {pvLineColor:one('pvLineColor',['green','yellow'],'green'),pvValueColor:one('pvValueColor',['green','yellow'],'green'),lineStyle:one('lineStyle',['classic','ribbon','comet'],'classic'),powerEffect:one('powerEffect',['fixed','speed','thickness'],'fixed'),lineCycleMs:number('lineCycleMs',1150,100,10000),lineWidthScale:number('lineWidthScale',1,.25,3),standbyWidthScale:number('standbyWidthScale',1,.25,3),ribbonGlow:number('ribbonGlow',100,0,200),cornerRounding:number('cornerRounding',0,0,100),cometCount:Math.round(number('cometCount',1,1,3)),valueTransition:one('valueTransition',['live','count','crossfade'],'live'),transitionMs:number('transitionMs',350,50,20000),powerLimits:limits};
  }
  function metrics(options,name,watts){
    const ratio=Math.min(1,Math.max(0,Math.abs(Number(watts)||0)/options.powerLimits[name]));
    return {cycleMs:options.powerEffect==='speed'?options.lineCycleMs+(Math.max(3000,options.lineCycleMs)-options.lineCycleMs)*(1-Math.pow(ratio,.65)):options.lineCycleMs,width:options.lineWidthScale*(options.powerEffect==='thickness'?.35+.65*ratio:1)};
  }
  function roundedPath(path,amount){
    if(!amount)return path;
    const points=[...path.matchAll(/[ML]\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/g)].map(m=>[Number(m[1]),Number(m[2])]);
    if(points.length<3)return path;
    let result=`M${points[0].join(' ')}`;
    for(let i=1;i<points.length;i++){
      const b=points[i];if(i===points.length-1){result+=` L${b.join(' ')}`;continue;}
      const a=points[i-1],c=points[i+1],before=Math.hypot(b[0]-a[0],b[1]-a[1]),after=Math.hypot(c[0]-b[0],c[1]-b[1]);
      if(!before||!after){result+=` L${b.join(' ')}`;continue;}
      const radius=Math.min(before,after)*amount/100*.48;
      const start=b.map((v,j)=>v+(a[j]-v)*radius/before),end=b.map((v,j)=>v+(c[j]-v)*radius/after);
      result+=` L${start.join(' ')} Q${b.join(' ')} ${end.join(' ')}`;
    }
    return result;
  }
  function pathLength(path){
    const tokens=path.match(/[MLQ]|-?(?:\d*\.)?\d+(?:e[+-]?\d+)?/gi)||[],vertices=[];let i=0,current=[0,0];
    const read=()=>[Number(tokens[i++]),Number(tokens[i++])];
    while(i<tokens.length){
      const command=tokens[i++];
      if(command==='M'||command==='L'){current=read();vertices.push(current);}
      else if(command==='Q'){
        const control=read(),end=read(),start=current;
        for(let j=1;j<=24;j++){const t=j/24,u=1-t;vertices.push([u*u*start[0]+2*u*t*control[0]+t*t*end[0],u*u*start[1]+2*u*t*control[1]+t*t*end[1]]);}
        current=end;
      }else return 1;
    }
    let length=0;for(let j=1;j<vertices.length;j++)length+=Math.hypot(vertices[j][0]-vertices[j-1][0],vertices[j][1]-vertices[j-1][1]);
    return Math.max(.001,length);
  }

  function createLines(doc){
    const states={},ns='http://www.w3.org/2000/svg';let options=normalize(),disposed=false;
    for(const name of names){
      const svg=doc.getElementById(name+'FlowOverlay'),core=svg.querySelector('.flow-core'),glow=svg.querySelector('.flow-glow');
      const spark=doc.createElementNS(ns,'path');spark.setAttribute('class','effect-spark');svg.appendChild(spark);
      const trails=[],heads=[];
      for(let i=0;i<3;i++){
        const segments=[];
        for(let j=0;j<10;j++){
          const tail=doc.createElementNS(ns,'path');tail.setAttribute('class','effect-tail');tail.setAttribute('pathLength','100');tail.style.display='none';svg.appendChild(tail);segments.push(tail);

       energyEl.style.backgroundImage=`url('${url}')`;
       photoTimer=setTimeout(()=>loadPhoto(attempt+1),Math.min(300000,30000*2**Math.min(attempt,4)));
     };
     img.onerror=failed;
     img.onload=()=>{
       if(!img.naturalWidth||!img.naturalHeight){failed();return;}
       finish();if(generation!==photoGeneration)return;
       energyEl.style.backgroundImage=`url('${requested}'),url('${url}')`;scheduleHeightSync(true);
     };
     task.timer=setTimeout(failed,15000);photoLoad=task;img.src=requested;
   }
   loadPhoto();
 }
 function render(d){
   valueEffects.configure(d.visualConfig?.effects);
   const effectOptions=effects.normalize(d.visualConfig?.effects);
   frame.dataset.pvValueColor=effectOptions.pvValueColor;
   applyLayout(d.visualConfig||{});
   applyScene(d.scene||{},d.visualConfig||{},d.galleryPhoto);
   applyPanelStyles(d.visualConfig||{});
   frame.style.setProperty('--line-blink-interval',`${Number(d.visualConfig&&d.visualConfig.lineBlinkTempo||2.4)}s`);
   const textScale=Math.min(1.1,Math.max(.5,Number(d.visualConfig&&d.visualConfig.widgetTextScale||90)/100));
   const titleScale=Math.min(1.3,Math.max(.5,Number(d.visualConfig&&d.visualConfig.widgetTitleScale||100)/100));
   energyEl.style.setProperty('--widget-text-scale',String(textScale));
   energyEl.style.setProperty('--widget-title-scale',String(titleScale));
   const customLabels=d.visualConfig&&d.visualConfig.labels||{};
   document.querySelector('.solar .kicker').textContent=customLabels.solar||tr('widget.solar');
   document.querySelector('.grid .kicker').textContent=customLabels.grid||tr('widget.grid');
   document.querySelector('.battery .kicker').textContent=customLabels.battery||tr('widget.battery');
   document.querySelector('.home .kicker').textContent=customLabels.home||tr('widget.home');
   document.querySelector('.ev .kicker').textContent=customLabels.ev||tr('widget.ev');
   const e=d.energy||{};
   const hasSolar=Number(e.solarCount)>0,hasBattery=Number(e.batteryCount)>0,hasEv=Number(e.evChargerCount)>0;
   document.querySelector('.callout.solar').classList.toggle('component-hidden',!hasSolar);
   document.querySelector('.callout.battery').classList.toggle('component-hidden',!hasBattery);
   document.querySelector('.callout.ev').classList.toggle('component-hidden',!hasEv);
   const showBattery24h=hasBattery && (!d.visualConfig || d.visualConfig.showBattery24h!==false);
   const standbyStyle=value=>['blue','green','greenblue','yellow','gray'].includes(String(value||''))?String(value):'blue';
   const solarStandbyLineEnabled=Boolean(d.visualConfig&&d.visualConfig.solarStandbyLineEnabled);
   const solarStandbyLineBlink=Boolean(d.visualConfig&&d.visualConfig.solarStandbyLineBlink);
   const solarStandbyLineStyle=standbyStyle(d.visualConfig&&d.visualConfig.solarStandbyLineStyle||'green');
   const batteryStandbyLineEnabled=!d.visualConfig||d.visualConfig.batteryStandbyLineEnabled!==false;
   const batteryStandbyLineBlink=Boolean(d.visualConfig&&d.visualConfig.batteryStandbyLineBlink);
   const batteryStandbyLineStyle=standbyStyle(d.visualConfig&&d.visualConfig.batteryStandbyLineStyle||'blue');
   const gridStandbyLineEnabled=!d.visualConfig||d.visualConfig.gridStandbyLineEnabled!==false;
   const gridStandbyLineBlink=Boolean(d.visualConfig&&d.visualConfig.gridStandbyLineBlink);
   const gridStandbyLineStyle=standbyStyle(d.visualConfig&&d.visualConfig.gridStandbyLineStyle||'blue');
   $('batteryAgo').classList.toggle('component-hidden',!showBattery24h);
   const powerUnits=d.visualConfig&&d.visualConfig.powerUnits||{};
   setPowerEnergy('solar',e.solar,powerUnits.solar||'kw');
   const solarWatts=powerToWatts(e.solar);
   const solarAvailable=Boolean(e.solar&&e.solar.online);
   const solarActive=hasSolar && solarAvailable && solarWatts!==null && solarWatts>15;
   if(solarActive){$('solarFlowOverlay').setAttribute('class','flow-overlay solar-active');}
   else if(hasSolar&&solarAvailable&&solarStandbyLineEnabled){$('solarFlowOverlay').setAttribute('class','flow-overlay standby standby-'+solarStandbyLineStyle+(solarStandbyLineBlink?' standby-blink':''));}
   else{$('solarFlowOverlay').setAttribute('class','flow-overlay flow-hidden');}
   setPowerEnergy('grid',e.gridPower,powerUnits.grid||'w');
   setEnergy('batterySoc',e.batterySoc);
   setPowerEnergy('home',e.homePower,powerUnits.home||'w');
   setPowerEnergy('ev',e.evPower,powerUnits.ev||'kw');
   $('homeStatus').textContent=e.homePower&&e.homePower.derived?tr('widget.calculated'):tr('widget.consumption');
   const bs=$('batteryStatus');
   let status=e.batteryStatus||'—';
   if(e.batteryStatusSource==='derived'){if(e.batteryFlow==='charge')status=tr('widget.charging');else if(e.batteryFlow==='discharge')status=tr('widget.discharging');else status=tr('widget.standby');}
   else {const rawStatus=String(status).trim().toLowerCase();if(/^(laden|charging|charge)$/.test(rawStatus))status=tr('widget.charging');else if(/^(ontladen|discharging|discharge)$/.test(rawStatus))status=tr('widget.discharging');else if(/^(stand-by|standby|idle)$/.test(rawStatus))status=tr('widget.standby');}
   const statusKey=String(status).trim().toLowerCase();
   const flowSource=e.batteryLineFlow || e.batteryFlow;
  const flowMode=['charge','discharge','idle'].includes(flowSource)?flowSource:'';
   const isCharge=flowMode?flowMode==='charge':/(^|\b)(laden|charging|charge)(\b|$)/.test(statusKey)&&!/(ontladen|discharging|discharge)/.test(statusKey);
   const isDischarge=flowMode?flowMode==='discharge':/(ontladen|discharging|discharge)/.test(statusKey);
   const batteryFlowMode=isCharge?'charge':isDischarge?'discharge':'idle';
   const reverseMotion=typeof e.batteryLineMotionReverse==='boolean' ? e.batteryLineMotionReverse : batteryFlowMode!=='charge';
   if(!hasBattery){
     $('batteryFlowOverlay').setAttribute('class','flow-overlay flow-hidden');
   }else if(batteryFlowMode==='idle'&&batteryStandbyLineEnabled){
     $('batteryFlowOverlay').setAttribute('class','flow-overlay standby standby-'+batteryStandbyLineStyle+(batteryStandbyLineBlink?' standby-blink':''));
   }else if(batteryFlowMode==='idle'){
     $('batteryFlowOverlay').setAttribute('class','flow-overlay flow-hidden');
   }else{
     $('batteryFlowOverlay').setAttribute('class','flow-overlay '+batteryFlowMode+' '+(reverseMotion?'motion-reverse':'motion-normal'));
   }
   bs.textContent=status;bs.className='sub batteryState '+(isCharge?'status-charge':isDischarge?'status-discharge':'status-idle');
   const bp=$('batteryPower');
   if(e.batteryPower&&e.batteryPower.online){
     const formattedBattery=formatPower(e.batteryPower,powerUnits.battery||'kw',isCharge||isDischarge);
     valueEffects.set(bp,`${formattedBattery.value}${formattedBattery.unit?' '+formattedBattery.unit:''}`);
   }else valueEffects.set(bp,'');
   bp.className='sub batteryPower '+(isCharge?'power-charge':isDischarge?'power-discharge':'power-idle');
   $('batteryAgo').textContent=showBattery24h?(e.battery24hAgo?`◷ 24h · ${e.battery24hAgo.valueFormatted}${e.battery24hAgo.unit?' '+e.battery24hAgo.unit:''}`:'◷ 24h · —'):'';
   const gp=e.gridPower&&typeof e.gridPower.rawValue==='number'?e.gridPower.rawValue:null, gridStatus=$('gridStatus'), gridValue=$('gridValue');
   const gridFlow=['import','export','idle'].includes(e.gridFlow)?e.gridFlow:'idle';
   const gridMode=gridFlow==='import'?'grid-import':gridFlow==='export'?'grid-export':'';
   const gridAvailable=Boolean(e.gridPower&&e.gridPower.online);
   if(gridFlow==='idle'&&gridAvailable&&gridStandbyLineEnabled){
     $('gridFlowOverlay').setAttribute('class','flow-overlay standby standby-'+gridStandbyLineStyle+(gridStandbyLineBlink?' standby-blink':''));
   }else if(gridFlow==='idle'){
     $('gridFlowOverlay').setAttribute('class','flow-overlay flow-hidden');
   }else{
     $('gridFlowOverlay').setAttribute('class','flow-overlay '+(gridFlow==='import'?'grid-import':'grid-export'));
   }
   gridStatus.textContent=gp===null?tr('widget.grid_short'):gridFlow==='export'?tr('widget.exporting'):gridFlow==='import'?tr('widget.importing'):tr('widget.grid_short');
   gridStatus.className='sub '+gridMode;gridValue.className='value '+gridMode;
   $('evStatus').textContent=e.evChargerCount>1?tr('widget.chargers',{count:e.evChargerCount}):(e.evStatus&&e.evStatus.online?String(e.evStatus.value):tr('widget.charger'));
   const evCard=document.querySelector('.callout.ev');
   if(evCard){
     const evPower=e.evPower;
     const evWatts=powerToWatts(evPower);
     const evActive=hasEv && evWatts!==null && Math.abs(evWatts)>=50;
     const evVisible=hasEv && (d.visualConfig?.evDisplayMode==='always' || (evWatts!==null && Math.abs(evWatts)>0));
     evCard.classList.toggle('ev-inactive',!evVisible);
     const solarWatts=powerToWatts(e.solar);
     const homeWatts=powerToWatts(e.homePower);
     const pvSurplus=hasSolar && solarWatts!==null && homeWatts!==null && solarWatts>homeWatts;
     const evMode=pvSurplus?'ev-solar':'ev-grid';
     $('evFlowOverlay').setAttribute('class','flow-overlay '+(evActive?evMode:'flow-hidden'));
   }else $('evFlowOverlay').setAttribute('class','flow-overlay flow-hidden');
   lineEffects.update(d.visualConfig?.effects,{solar:hasSolar?solarWatts:null,grid:powerToWatts(e.gridPower),battery:hasBattery?powerToWatts(e.batteryPower):null,ev:hasEv?powerToWatts(e.evPower):null});
   extra.innerHTML='';const tiles=Array.isArray(d.tiles)?d.tiles:[];
   if(!tiles.length){extra.classList.add('hidden');return;}
   extra.classList.remove('hidden');
   for(const t of tiles){const el=document.createElement('article');const isBool=t.kind==='boolean',isOn=isBool&&Boolean(t.rawValue);el.className=`tile${isBool?' boolean':''}${isOn?' boolean-on':''}${t.online?'':' offline'}`;el.innerHTML='<div class="tile-head"><div class="names"><div class="label"></div><div class="subtitle"></div></div><div class="dot"></div></div><div class="reading2"><div class="value2"></div><div class="unit2"></div></div>';el.querySelector('.label').textContent=t.label||t.deviceName||tr('widget.item');el.querySelector('.subtitle').textContent=capabilitySubtitle(t);el.querySelector('.dot').className='dot'+(t.online?' online':'');el.querySelector('.value2').textContent=t.value??'—';el.querySelector('.unit2').textContent=!isBool&&t.unit?t.unit:'';extra.appendChild(el);}
 }
 let lastRenderedDashboardSignature='',watchdogTimer=null;
 function dashboardSignature(d){
   if(!d)return '';
   return JSON.stringify({revision:d.revision,configured:d.configured,energy:d.energy,tiles:d.tiles,scene:d.scene,visualConfig:d.visualConfig,galleryPhoto:d.galleryPhoto});
 }
 function watchdogDelayMs(){
   const seconds=Math.min(300,Math.max(1,Number(lastDashboard&&lastDashboard.visualConfig&&lastDashboard.visualConfig.refreshSeconds)||30));
   return Math.max(60000,seconds*5*1000);
 }
 function clearWatchdog(){if(watchdogTimer){clearTimeout(watchdogTimer);watchdogTimer=null;}}
 function scheduleWatchdog(){
   clearWatchdog();
   if(document.hidden)return;
   watchdogTimer=setTimeout(async()=>{
     watchdogTimer=null;
     if(document.hidden)return;
     try{
       const fresh=await Homey.api('GET','/dashboard');
       const freshSignature=dashboardSignature(fresh);
       if(lastRenderedDashboardSignature&&freshSignature&&freshSignature!==lastRenderedDashboardSignature){
         window.location.reload();
         return;
       }
     }catch(err){console.error('Dashboard watchdog check failed',err);}
     scheduleWatchdog();
   },watchdogDelayMs());
 }
 let lastDashboard=null;
 function renderDashboard(d){
   lastDashboard=d||lastDashboard;
   render(d);
   lastRenderedDashboardSignature=dashboardSignature(d);
   scheduleWatchdog();
 }
 async function loadInitialDashboard(){try{renderDashboard(await Homey.api('GET','/dashboard'));}catch(err){console.error(err);extra.classList.add('hidden');scheduleHeightSync(true);scheduleWatchdog();}}
 window.addEventListener('pagehide',()=>{lineEffects.destroy();valueEffects.destroy();},{once:true});
 Homey.on('dashboard.updated',renderDashboard);
 let wasHidden=false;
 document.addEventListener('visibilitychange',()=>{
   if(document.hidden){
     wasHidden=true;
     clearWatchdog();
     return;
   }
   if(wasHidden){
     window.location.reload();
     return;
   }
   scheduleWatchdog();
 });
 const ro=new ResizeObserver(()=>{scheduleHeightSync();scheduleLineGeometry();});ro.observe(frame);ro.observe(document.body);ro.observe(extra);ro.observe(energyEl);
 window.addEventListener('resize',()=>scheduleHeightSync(true));
 window.addEventListener('pagehide',clearWatchdog);
 window.addEventListener('pagehide',()=>{photoGeneration++;clearPhotoLoad();});
 window.addEventListener('pagehide',()=>{if(geometryFrame!==null)cancelAnimationFrame(geometryFrame);if(batteryObserver)batteryObserver.disconnect();});
 loadInitialDashboard().finally(()=>scheduleHeightSync(true));
}

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/homey.js"></script>
<style>
:root{color-scheme:light dark;--gap:10px;--radius:20px}*{box-sizing:border-box}html,body{margin:0;padding:0;background:transparent;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--homey-text-color,#fff)}body{padding:8px}.frame{width:100%;display:flex;flex-direction:column;gap:var(--gap);overflow:visible}.energy{position:relative;width:100%;aspect-ratio:7/5;overflow:hidden;border-radius:var(--radius);background:#17212a center/cover no-repeat;box-shadow:0 10px 28px rgba(0,0,0,.18);isolation:isolate}.energy:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.08));z-index:1}.callout{position:absolute;z-index:2;padding:9px 11px;border-radius:14px;background:rgba(12,17,23,.96);color:#fff;border:1px solid rgba(255,255,255,.22);box-shadow:0 7px 20px rgba(0,0,0,.34);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}.kicker{font-size:clamp(7px,2.15vw,11px);font-weight:800;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reading{display:flex;gap:4px;align-items:baseline;margin-top:3px;white-space:nowrap}.value{font-size:clamp(18px,5.7vw,34px);font-weight:830;line-height:1}.unit{font-size:clamp(8px,2.6vw,14px);font-weight:750;opacity:.9}.sub{font-size:clamp(7px,2.15vw,11px);margin-top:5px;font-weight:680;line-height:1.15}.solar{left:4.2%;top:5.8%;width:25%}.grid{right:4.5%;top:7.2%;width:24%}.battery{left:3.2%;bottom:10%;width:22%}.home{left:39%;top:40%;width:27%}.ev{right:5.5%;bottom:4.5%;width:23%}.solar .value{color:#70e93f}.grid .value,.ev .value{color:#49a4ff}.battery .value{color:#70e93f}.battery .sub.status-charge{color:#70e93f}.battery .sub.status-discharge{color:#49a4ff}.battery .sub.status-idle{color:#d2d7df}.batteryState{font-size:clamp(9px,2.8vw,15px);font-weight:800}.batteryPower{font-size:clamp(10px,3.2vw,17px);font-weight:820}.batteryPower.power-charge{color:#70e93f}.batteryPower.power-discharge{color:#49a4ff}.batteryPower.power-idle{color:#d2d7df}.grid .value.grid-import,.grid .sub.grid-import{color:#49a4ff}.grid .value.grid-export,.grid .sub.grid-export{color:#70e93f}.batteryAgo{opacity:.78;font-weight:650}.extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}.extra.hidden{display:none}.tile{padding:12px 13px;border-radius:15px;background:var(--homey-background-color,rgba(127,127,127,.11));border:1px solid rgba(127,127,127,.18);min-height:84px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.tile-head{display:flex;justify-content:space-between;gap:8px}.names{min-width:0}.label{font-size:13px;font-weight:770;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subtitle{font-size:10px;opacity:.5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:7px;height:7px;border-radius:50%;background:#aaa;flex:none;margin-top:4px}.dot.online{background:#52c56c}.reading2{display:flex;gap:4px;align-items:baseline;margin-top:10px}.value2{font-size:25px;font-weight:790;line-height:1}.unit2{font-size:12px;font-weight:700;opacity:.58}.boolean .value2{font-size:22px}.boolean-on .value2{color:#44bf63}.offline{opacity:.55}@media(min-width:520px){body{padding:10px}.extra{grid-template-columns:repeat(3,minmax(0,1fr))}.callout{padding:11px 13px}}@media(min-width:760px){.extra{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:360px){body{padding:6px;--gap:7px;--radius:16px}.callout{padding:6px 7px;border-radius:10px}.battery{width:24%;bottom:8%}.home{width:29%;left:37%}.ev{width:24%}.tile{padding:10px;min-height:78px}}
</style>
</head>
<body>
<main class="frame" id="frame">
  <section class="energy" id="energy" aria-label="Live energie-overzicht">
    <div class="callout solar"><div class="kicker">Zonnepanelen</div><div class="reading"><span class="value" id="solarValue">—</span><span class="unit" id="solarUnit"></span></div><div class="sub">Productie</div></div>
    <div class="callout grid"><div class="kicker">Elektriciteitsnet</div><div class="reading"><span class="value" id="gridValue">—</span><span class="unit" id="gridUnit"></span></div><div class="sub" id="gridStatus">Net</div></div>
    <div class="callout battery"><div class="kicker">Batterij</div><div class="reading"><span class="value" id="batterySocValue">—</span><span class="unit" id="batterySocUnit"></span></div><div class="sub batteryState" id="batteryStatus">—</div><div class="sub batteryPower" id="batteryPower"></div><div class="sub batteryAgo" id="batteryAgo"></div></div>
    <div class="callout home"><div class="kicker">Huisverbruik</div><div class="reading"><span class="value" id="homeValue">—</span><span class="unit" id="homeUnit"></span></div><div class="sub" id="homeStatus">Verbruik</div></div>
    <div class="callout ev"><div class="kicker">Autolader</div><div class="reading"><span class="value" id="evValue">—</span><span class="unit" id="evUnit"></span></div><div class="sub" id="evStatus">Lader</div></div>
  </section>
  <section id="extra" class="extra hidden" aria-label="Extra dashboarditems"></section>
</main>
<script>
function onHomeyReady(Homey){
 const $=id=>document.getElementById(id), frame=$('frame'), energyEl=$('energy'), extra=$('extra');
 const BACKGROUNDS={
   'day-clear':'./scene-day-clear.jpg',
   'day-cloudy':'./scene-day-cloudy.jpg',
   'day-rain':'./scene-day-rain.jpg',
   'day-mist':'./scene-day-mist.jpg',
   'day-snow':'./scene-day-snow.jpg',
   'day-thunder':'./scene-day-thunder.jpg',
   'night-clear':'./scene-night-clear.jpg',
   'night-cloudy':'./scene-night-cloudy.jpg',
   'night-rain':'./scene-night-rain.jpg',
   'night-mist':'./scene-night-mist.jpg',
   'night-snow':'./scene-night-snow.jpg',
   'night-thunder':'./scene-night-thunder.jpg'
 };
 let readyCalled=false,lastHeight=0,heightTimer=null,currentScene='',pollTimer=null,pollSeconds=0;
 function measuredHeight(){
   const frameRect=frame.getBoundingClientRect();
   const style=getComputedStyle(document.body);
   return Math.max(1,Math.ceil(frameRect.height+parseFloat(style.paddingTop||0)+parseFloat(style.paddingBottom||0)));
 }
 async function syncHeight(force=false){
   clearTimeout(heightTimer);
   heightTimer=setTimeout(async()=>{
     const h=measuredHeight();
     if(!force&&Math.abs(h-lastHeight)<2)return;
     lastHeight=h;
     try{if(!readyCalled){readyCalled=true;Homey.ready({height:h});}else{await Homey.setHeight(h);}}catch(e){console.error('Widget height update failed',e);}
   },30);
 }
 function scheduleHeightSync(force=false){[0,60,180,420,900].forEach((delay,i)=>setTimeout(()=>syncHeight(force&&i===0),delay));}
 function setEnergy(prefix,data){$(prefix+'Value').textContent=data&&data.online?(data.value??'—'):'—';$(prefix+'Unit').textContent=data&&data.online?(data.unit||''):'';}
 function capabilitySubtitle(tile){if(tile.sourceName&&tile.sourceName!==tile.label)return tile.sourceName;if(tile.sourceLabel&&tile.sourceLabel.includes('—')){const p=tile.sourceLabel.split('—').slice(1).join('—').trim();if(p&&p!==tile.label)return p;}return tile.kind==='boolean'?'Status':'Waarde';}
 function applyScene(scene){const key=scene&&scene.key?scene.key:'day-clear';if(key===currentScene)return;currentScene=key;const url=BACKGROUNDS[key]||BACKGROUNDS['day-clear'];energyEl.style.backgroundImage=`url('${url}')`;const img=new Image();img.onload=()=>scheduleHeightSync(true);img.src=url;}
 function ensurePoll(seconds){
   const next=Math.min(300,Math.max(1,Number(seconds)||30));
   if(next===pollSeconds&&pollTimer)return;
   if(pollTimer)clearInterval(pollTimer);
   pollSeconds=next;
   pollTimer=setInterval(refresh,next*1000);
 }
 function render(d){
   applyScene(d.scene||{});
   ensurePoll(d.visualConfig&&d.visualConfig.refreshSeconds);
   const e=d.energy||{};setEnergy('solar',e.solar);setEnergy('grid',e.gridPower);setEnergy('batterySoc',e.batterySoc);setEnergy('home',e.homePower);setEnergy('ev',e.evPower);
   $('homeStatus').textContent=e.homePower&&e.homePower.derived?'Berekend':'Verbruik';
   const bs=$('batteryStatus'), status=e.batteryStatus||'—', statusKey=String(status).trim().toLowerCase();
   const isCharge=/(^|\b)(laden|charging|charge)(\b|$)/.test(statusKey)&&!/(ontladen|discharging|discharge)/.test(statusKey);
   const isDischarge=/(ontladen|discharging|discharge)/.test(statusKey);
   bs.textContent=status;bs.className='sub batteryState '+(isCharge?'status-charge':isDischarge?'status-discharge':'status-idle');
   const bp=$('batteryPower');bp.textContent=e.batteryPower&&e.batteryPower.online?`${e.batteryPower.value}${e.batteryPower.unit?' '+e.batteryPower.unit:''}`:'';
   bp.className='sub batteryPower '+(isCharge?'power-charge':isDischarge?'power-discharge':'power-idle');
   $('batteryAgo').textContent=e.battery24hAgo?`24u geleden ${e.battery24hAgo.valueFormatted}${e.battery24hAgo.unit?' '+e.battery24hAgo.unit:''}`:'24u geleden —';
   const gp=e.gridPower&&typeof e.gridPower.rawValue==='number'?e.gridPower.rawValue:null, gridStatus=$('gridStatus'), gridValue=$('gridValue');
   const gridMode=gp===null?'':gp<0?'grid-export':'grid-import';
   gridStatus.textContent=gp===null?'Net':gp<0?'Terugleveren':'Afnemen';
   gridStatus.className='sub '+gridMode;gridValue.className='value '+gridMode;
   $('evStatus').textContent=e.evStatus&&e.evStatus.online?String(e.evStatus.value):'Lader';
   extra.innerHTML='';const tiles=Array.isArray(d.tiles)?d.tiles:[];
   if(!tiles.length){extra.classList.add('hidden');scheduleHeightSync(true);return;}
   extra.classList.remove('hidden');
   for(const t of tiles){const el=document.createElement('article');const isBool=t.kind==='boolean',isOn=isBool&&Boolean(t.rawValue);el.className=`tile${isBool?' boolean':''}${isOn?' boolean-on':''}${t.online?'':' offline'}`;el.innerHTML='<div class="tile-head"><div class="names"><div class="label"></div><div class="subtitle"></div></div><div class="dot"></div></div><div class="reading2"><div class="value2"></div><div class="unit2"></div></div>';el.querySelector('.label').textContent=t.label||t.deviceName||'Item';el.querySelector('.subtitle').textContent=capabilitySubtitle(t);el.querySelector('.dot').className='dot'+(t.online?' online':'');el.querySelector('.value2').textContent=t.value??'—';el.querySelector('.unit2').textContent=!isBool&&t.unit?t.unit:'';extra.appendChild(el);}
   scheduleHeightSync(true);
 }
 async function refresh(){try{render(await Homey.api('GET','/dashboard'));}catch(err){console.error(err);extra.classList.add('hidden');scheduleHeightSync(true);}}
 Homey.on('dashboard.updated',render);
 const ro=new ResizeObserver(()=>scheduleHeightSync());ro.observe(frame);ro.observe(document.body);ro.observe(extra);ro.observe(energyEl);
 new MutationObserver(()=>scheduleHeightSync()).observe(frame,{childList:true,subtree:true,attributes:true});
 window.addEventListener('resize',()=>scheduleHeightSync(true));
 refresh().finally(()=>scheduleHeightSync(true));
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="/homey.js"></script>
<style>
:root{
  color-scheme:light dark;
  --gap:10px;
  --radius:20px;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  color:var(--homey-text-color,#fff);
}
body{padding:8px}
.frame{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:var(--gap);
  overflow:visible;
  --energy-border:rgba(255,255,255,.18);
  --energy-shadow:0 10px 28px rgba(0,0,0,.18);
  --energy-overlay:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.08));
  --callout-bg:rgba(12,17,23,.58);
  --callout-border:rgba(255,255,255,.28);
  --callout-shadow:0 7px 20px rgba(0,0,0,.30);
  --callout-text:#fff;
  --callout-muted:#d2d7df;
  --callout-text-shadow:0 1px 2px rgba(0,0,0,.72);
  --tile-bg:rgba(24,30,38,.18);
  --tile-border:rgba(255,255,255,.10);
  --tile-shadow:0 2px 8px rgba(0,0,0,.06);
  --tile-subtitle-opacity:.5;
}
.frame[data-theme="light"]{
  --energy-border:rgba(255,255,255,.82);
  --energy-shadow:0 10px 24px rgba(96,104,132,.10), 0 2px 8px rgba(96,104,132,.05);
  --energy-overlay:linear-gradient(180deg,rgba(255,255,255,.08),rgba(244,241,248,.15));
  --callout-bg:rgba(255,255,255,.92);
  --callout-border:rgba(255,255,255,.88);
  --callout-shadow:0 5px 14px rgba(86,91,116,.08), 0 1px 4px rgba(86,91,116,.04);
  --callout-text:#20232b;
  --callout-muted:#626875;
  --callout-text-shadow:none;
  --tile-bg:rgba(255,255,255,.96);
  --tile-border:rgba(255,255,255,.82);
  --tile-shadow:0 6px 14px rgba(96,104,132,.06), 0 2px 5px rgba(96,104,132,.04);
  --tile-subtitle-opacity:.46;
}

.frame[data-theme="light"] .solar .value,
.frame[data-theme="light"] .battery .value,
.frame[data-theme="light"] .battery .sub.status-charge,
.frame[data-theme="light"] .batteryPower.power-charge,
.frame[data-theme="light"] .grid .value.grid-export,
.frame[data-theme="light"] .grid .sub.grid-export{color:#2fae23}
.frame[data-theme="light"] .grid .value,
.frame[data-theme="light"] .ev .value,
.frame[data-theme="light"] .battery .sub.status-discharge,
.frame[data-theme="light"] .batteryPower.power-discharge,
.frame[data-theme="light"] .grid .value.grid-import,
.frame[data-theme="light"] .grid .sub.grid-import{color:#1688dd}
.energy{
  position:relative;
  width:100%;
  aspect-ratio:7/5;
  overflow:hidden;
  border-radius:var(--radius);
  background:#17212a center/cover no-repeat;
  border:1px solid var(--energy-border);
  box-shadow:var(--energy-shadow);
  isolation:isolate;
  transition:border-color .28s ease, box-shadow .28s ease, background-color .28s ease;
}
.energy:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:var(--energy-overlay);
  z-index:1;
  transition:background .28s ease;
}
.flow-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.flow-overlay{z-index:2.4;opacity:1;transition:opacity .25s ease}
.flow-overlay path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .25s ease,stroke .25s ease}
.flow-overlay .flow-glow{stroke-width:2.8;opacity:.28;filter:blur(.9px)}
.flow-overlay .flow-core{stroke-width:1.15;stroke-dasharray:3.2 2.2;animation:flowMove 1.15s linear infinite}
.flow-overlay.flow-hidden{opacity:0}
.flow-overlay.motion-reverse .flow-core{animation-direction:reverse}
.flow-overlay.standby .flow-core,.flow-overlay.standby .flow-glow{stroke-dasharray:3.2 2.2;stroke-dashoffset:0;animation:none}
.flow-overlay.standby-blue .flow-glow,.flow-overlay.standby-blue .flow-core{stroke:#49a4ff}
.flow-overlay.standby-green .flow-glow,.flow-overlay.standby-green .flow-core{stroke:#70e93f}
#solarFlowOverlay.standby-greenblue .flow-glow,#solarFlowOverlay.standby-greenblue .flow-core{stroke:url(#solarStandbyGreenBlue)}
#batteryFlowOverlay.standby-greenblue .flow-glow,#batteryFlowOverlay.standby-greenblue .flow-core{stroke:url(#batteryStandbyGreenBlue)}
#gridFlowOverlay.standby-greenblue .flow-glow,#gridFlowOverlay.standby-greenblue .flow-core{stroke:url(#gridStandbyGreenBlue)}
.flow-overlay.standby.standby-blink .flow-core{animation:standbyBlinkCore var(--line-blink-interval,2.4s) ease-in-out infinite}
.flow-overlay.standby.standby-blink .flow-glow{animation:standbyBlinkGlow var(--line-blink-interval,2.4s) ease-in-out infinite}
.flow-overlay.solar-active .flow-glow,.flow-overlay.solar-active .flow-core{stroke:#70e93f}
.flow-overlay.charge .flow-glow,.flow-overlay.charge .flow-core{stroke:#70e93f}
.flow-overlay.discharge .flow-glow,.flow-overlay.discharge .flow-core{stroke:#49a4ff}
.flow-overlay.grid-import .flow-glow,.flow-overlay.grid-import .flow-core{stroke:#49a4ff}
.flow-overlay.grid-export .flow-glow,.flow-overlay.grid-export .flow-core{stroke:#70e93f}
.flow-overlay.grid-export .flow-core{animation-direction:reverse}
.flow-overlay.ev-grid .flow-glow,.flow-overlay.ev-grid .flow-core{stroke:#49a4ff}
.flow-overlay.ev-solar .flow-glow,.flow-overlay.ev-solar .flow-core{stroke:#70e93f}
@keyframes flowMove{to{stroke-dashoffset:-10.8}}
@keyframes flowBlink{0%,46%{stroke:#49a4ff}54%,100%{stroke:#70e93f}}
@keyframes standbyBlinkCore{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes standbyBlinkGlow{0%,100%{opacity:.28}50%{opacity:.08}}
.callout{
  position:absolute;
  z-index:3;
  padding:9px 11px;
  border-radius:14px;
  background:var(--callout-bg);
  color:var(--callout-text,#fff);
  border:1px solid var(--callout-border);
  box-shadow:var(--callout-shadow);
  backdrop-filter:blur(2px) saturate(1);
  -webkit-backdrop-filter:blur(2px) saturate(1);
  min-width:0;
  overflow:hidden;
  text-shadow:var(--callout-text-shadow);
  transition:background .28s ease, border-color .28s ease, box-shadow .28s ease;
}
.callout-inner{display:block;transform-origin:top left;zoom:var(--widget-text-scale,.9);width:100%}
.kicker{font-size:calc(clamp(7px,2.15vw,11px) * var(--widget-title-scale,1));font-weight:800;letter-spacing:.035em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reading{display:flex;gap:4px;align-items:baseline;margin-top:3px;white-space:nowrap;min-width:0;max-width:100%;overflow:visible}
.value{font-size:clamp(18px,5.7vw,34px);font-weight:830;line-height:1}
.unit{font-size:clamp(8px,2.6vw,14px);font-weight:750;opacity:.9}
.sub{font-size:clamp(7px,2.15vw,11px);margin-top:5px;font-weight:680;line-height:1.15}
.solar{left:4.2%;top:5.8%;width:25%}
.grid{right:4.5%;top:7.2%;width:24%}
.battery{left:3.2%;bottom:10%;width:22%}
.home{left:39%;top:40%;width:27%}
.ev{right:5.5%;bottom:4.5%;width:23%;transition:opacity .28s ease,transform .28s ease,background .28s ease,border-color .28s ease,box-shadow .28s ease}
.ev.ev-inactive{opacity:0;transform:translateY(6px) scale(.97);pointer-events:none;visibility:hidden}
.component-hidden{display:none!important}
.solar .value{color:#70e93f}
.grid .value,.ev .value{color:#49a4ff}
.battery .value{color:#70e93f}
.battery .sub.status-charge{color:#70e93f}
.battery .sub.status-discharge{color:#49a4ff}
.battery .sub.status-idle{color:var(--callout-muted,#d2d7df)}
.batteryState{font-size:clamp(9px,2.8vw,15px);font-weight:800}
.batteryPower{font-size:clamp(10px,3.2vw,17px);font-weight:820;white-space:nowrap}
.batteryPower.power-charge{color:#70e93f}
.batteryPower.power-discharge{color:#49a4ff}
.batteryPower.power-idle{color:var(--callout-muted,#d2d7df)}
.grid .value.grid-import,.grid .sub.grid-import{color:#49a4ff}
.grid .value.grid-export,.grid .sub.grid-export{color:#70e93f}
.batteryAgo{opacity:.78;font-weight:650;white-space:nowrap}
.extra{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.extra.hidden{display:none}
.tile{
  padding:12px 13px;
  border-radius:18px;
  background:var(--tile-bg);
  border:1px solid var(--tile-border);
  min-height:84px;
  box-shadow:var(--tile-shadow);
  backdrop-filter:blur(1px) saturate(1);
  -webkit-backdrop-filter:blur(1px) saturate(1);
  transition:background .28s ease,border-color .28s ease,box-shadow .28s ease,opacity .28s ease;
}
.tile-head{display:flex;justify-content:space-between;gap:8px}
.names{min-width:0}
.label{font-size:13px;font-weight:770;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{font-size:10px;opacity:var(--tile-subtitle-opacity);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:#aaa;flex:none;margin-top:4px}
.dot.online{background:#52c56c}
.reading2{display:flex;gap:4px;align-items:baseline;margin-top:10px;white-space:nowrap;min-width:0;max-width:100%}
.value2{font-size:25px;font-weight:790;line-height:1}
.unit2{font-size:12px;font-weight:700;opacity:.58}
.boolean .value2{font-size:22px}
.boolean-on .value2{color:#44bf63}
.offline{opacity:.55}
@media(min-width:520px){body{padding:10px}.extra{grid-template-columns:repeat(3,minmax(0,1fr))}.callout{padding:11px 13px}}
@media(min-width:760px){.extra{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:360px){body{padding:6px;--gap:7px;--radius:16px}.callout{padding:6px 7px;border-radius:10px}.battery{width:24%;bottom:8%}.home{width:29%;left:37%}.ev{width:24%}.tile{padding:10px;min-height:78px}}
</style>
</head>
<body>
<main class="frame" id="frame">
  <section class="energy" id="energy" aria-label="Live energie-overzicht">

    <svg id="solarFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="solarStandbyGreenBlue" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#70e93f"/><stop offset=".48" stop-color="#70e93f"/><stop offset=".52" stop-color="#49a4ff"/><stop offset="1" stop-color="#49a4ff"/></linearGradient></defs>
      <path class="flow-glow" d="M16.7 25.5 L16.7 50.0 L39.0 50.0"/>
      <path class="flow-core" d="M16.7 25.5 L16.7 50.0 L39.0 50.0"/>
    </svg>
    <svg id="batteryFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="batteryStandbyGreenBlue" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#70e93f"/><stop offset=".48" stop-color="#70e93f"/><stop offset=".52" stop-color="#49a4ff"/><stop offset="1" stop-color="#49a4ff"/></linearGradient></defs>
      <path class="flow-glow" d="M46.0 61.0 L46.0 75.8 L35.4 75.8"/>
      <path class="flow-core" d="M46.0 61.0 L46.0 75.8 L35.4 75.8"/>
    </svg>
    <svg id="gridFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="gridStandbyGreenBlue" x1="0" y1="0" x2="12" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#70e93f"/><stop offset=".48" stop-color="#70e93f"/><stop offset=".52" stop-color="#49a4ff"/><stop offset="1" stop-color="#49a4ff"/></linearGradient></defs>
      <path class="flow-glow" d="M88.5 18.7 L88.5 47.5 L63.9 47.5"/>
      <path class="flow-core" d="M88.5 18.7 L88.5 47.5 L63.9 47.5"/>
    </svg>
    <svg id="evFlowOverlay" class="flow-overlay flow-hidden" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path class="flow-glow" d="M63.9 47.5 L73.6 47.5 L73.6 75.8"/>
      <path class="flow-core" d="M63.9 47.5 L73.6 47.5 L73.6 75.8"/>
    </svg>
    <div class="callout solar"><div class="callout-inner"><div class="kicker">Zonnepanelen</div><div class="reading"><span class="value" id="solarValue">—</span><span class="unit" id="solarUnit"></span></div><div class="sub">Productie</div></div></div>
    <div class="callout grid"><div class="callout-inner"><div class="kicker">Elektriciteitsnet</div><div class="reading"><span class="value" id="gridValue">—</span><span class="unit" id="gridUnit"></span></div><div class="sub" id="gridStatus">Net</div></div></div>
    <div class="callout battery"><div class="callout-inner"><div class="kicker">Batterij</div><div class="reading"><span class="value" id="batterySocValue">—</span><span class="unit" id="batterySocUnit"></span></div><div class="sub batteryState" id="batteryStatus">—</div><div class="sub batteryPower" id="batteryPower"></div><div class="sub batteryAgo" id="batteryAgo"></div></div></div>
    <div class="callout home"><div class="callout-inner"><div class="kicker">Huisverbruik</div><div class="reading"><span class="value" id="homeValue">—</span><span class="unit" id="homeUnit"></span></div><div class="sub" id="homeStatus">Verbruik</div></div></div>
    <div class="callout ev"><div class="callout-inner"><div class="kicker">Autolader</div><div class="reading"><span class="value" id="evValue">—</span><span class="unit" id="evUnit"></span></div><div class="sub" id="evStatus">Lader</div></div></div>
  </section>
  <section id="extra" class="extra hidden" aria-label="Extra dashboarditems"></section>
</main>
<script>
function onHomeyReady(Homey){
 const $=id=>document.getElementById(id), frame=$('frame'), energyEl=$('energy'), extra=$('extra');
 const tr=(key,tokens)=>Homey.__(key,tokens);
 energyEl.setAttribute('aria-label',tr('widget.aria_energy')); extra.setAttribute('aria-label',tr('widget.aria_extra'));
 document.querySelector('.solar .kicker').textContent=tr('widget.solar'); document.querySelector('.solar .sub').textContent=tr('widget.production');
 document.querySelector('.grid .kicker').textContent=tr('widget.grid'); document.querySelector('.battery .kicker').textContent=tr('widget.battery');
 document.querySelector('.home .kicker').textContent=tr('widget.home'); document.querySelector('.ev .kicker').textContent=tr('widget.ev');
 const BACKGROUNDS={
   'day-clear':'./scene-day-clear.jpg',
   'day-cloudy':'./scene-day-cloudy.jpg',
   'day-rain':'./scene-day-rain.jpg',
   'day-mist':'./scene-day-mist.jpg',
   'day-snow':'./scene-day-snow.jpg',
   'day-thunder':'./scene-day-thunder.jpg',
   'night-clear':'./scene-night-clear.jpg',
   'night-cloudy':'./scene-night-cloudy.jpg',
   'night-rain':'./scene-night-rain.jpg',
   'night-mist':'./scene-night-mist.jpg',
   'night-snow':'./scene-night-snow.jpg',
   'night-thunder':'./scene-night-thunder.jpg',
 };
 let readyCalled=false,lastHeight=0,heightTimer=null,currentScene='',pollTimer=null,pollSeconds=0;
 function measuredHeight(){
   const frameRect=frame.getBoundingClientRect();
   const style=getComputedStyle(document.body);
   return Math.max(1,Math.ceil(frameRect.height+parseFloat(style.paddingTop||0)+parseFloat(style.paddingBottom||0)));
 }
 async function syncHeight(force=false){
   clearTimeout(heightTimer);
   heightTimer=setTimeout(async()=>{
     const h=measuredHeight();
     if(!force&&Math.abs(h-lastHeight)<2)return;
     lastHeight=h;
     try{if(!readyCalled){readyCalled=true;Homey.ready({height:h});}else{await Homey.setHeight(h);}}catch(e){console.error('Widget height update failed',e);}
   },30);
 }
 function scheduleHeightSync(force=false){[0,60,180,420,900].forEach((delay,i)=>setTimeout(()=>syncHeight(force&&i===0),delay));}
 function setEnergy(prefix,data){$(prefix+'Value').textContent=data&&data.online?(data.value??'—'):'—';$(prefix+'Unit').textContent=data&&data.online?(data.unit||''):'';}
 function powerToWatts(data){
   if(!data||!data.online||typeof data.rawValue!=='number'||!Number.isFinite(data.rawValue))return null;
   const unit=String(data.unit||'').trim().toLowerCase();
   if(unit==='kw'||unit.includes('kilowatt'))return data.rawValue*1000;
   if(unit==='mw'||unit.includes('megawatt'))return data.rawValue*1000000;
   return data.rawValue;
 }
 function formatPower(data,targetUnit='w',absolute=false){
   const watts=powerToWatts(data);
   if(watts===null)return {value:'—',unit:''};
   const base=absolute?Math.abs(watts):watts;
   if(targetUnit==='kw'){
     const value=Math.round((base/1000)*100)/100;
     return {value:String(value),unit:'kW'};
   }
   return {value:String(Math.round(base)),unit:'W'};
 }
 function setPowerEnergy(prefix,data,targetUnit){
   const formatted=formatPower(data,targetUnit,false);
   $(prefix+'Value').textContent=formatted.value;
   $(prefix+'Unit').textContent=formatted.unit;
 }
 function capabilitySubtitle(tile){if(tile.sourceName&&tile.sourceName!==tile.label)return tile.sourceName;if(tile.sourceLabel&&tile.sourceLabel.includes('—')){const p=tile.sourceLabel.split('—').slice(1).join('—').trim();if(p&&p!==tile.label)return p;}return tile.kind==='boolean'?tr('widget.status'):tr('widget.value');}
 function sceneTheme(key,config){const forced=config&&config.overlayTheme;if(forced==='light'||forced==='dark')return forced;return String(key||'').startsWith('day-')?'light':'dark';}
 function alpha(base,transparency){return Math.max(0,Math.min(1,base*(1-(Math.max(0,Math.min(100,Number(transparency)||0))/100))));}
 function applyPanelStyles(config){
   const transparency=Math.max(0,Math.min(100,Number((config&&config.panelTransparency) ?? 30)));
   const isLight=frame.dataset.theme==='light';
   if(isLight){
     frame.style.setProperty('--callout-bg',`rgba(255,255,255,${alpha(.92,transparency)})`);
     frame.style.setProperty('--callout-border',`rgba(255,255,255,${Math.max(.16,alpha(.88,Math.max(0,transparency-10)))})`);
     frame.style.setProperty('--tile-bg',`rgba(255,255,255,${alpha(.96,transparency)})`);
     frame.style.setProperty('--tile-border',`rgba(255,255,255,${Math.max(.12,alpha(.86,Math.max(0,transparency-10)))})`);
   }else{
     frame.style.setProperty('--callout-bg',`rgba(12,17,23,${alpha(.58,transparency)})`);
     frame.style.setProperty('--callout-border',`rgba(255,255,255,${Math.max(.08,alpha(.28,Math.max(0,transparency-10)))})`);
     frame.style.setProperty('--tile-bg',`rgba(24,30,38,${alpha(.18,transparency)})`);
     frame.style.setProperty('--tile-border',`rgba(255,255,255,${Math.max(.08,alpha(.10,Math.max(0,transparency-10)))})`);
   }
 }
 function applyScene(scene,config){
   const key=scene&&scene.key?scene.key:'day-clear';
   frame.dataset.theme=sceneTheme(key,config);
   if(key===currentScene)return;
   currentScene=key;
   const url=BACKGROUNDS[key]||BACKGROUNDS['day-clear'];
   energyEl.style.backgroundImage=`url('${url}')`;
   const img=new Image();img.onload=()=>scheduleHeightSync(true);img.src=url;
 }
 function ensurePoll(seconds){
   const next=Math.min(300,Math.max(1,Number(seconds)||30));
   if(next===pollSeconds&&pollTimer)return;
   if(pollTimer)clearInterval(pollTimer);
   pollSeconds=next;
   pollTimer=setInterval(refresh,next*1000);
 }
 function render(d){
   applyScene(d.scene||{},d.visualConfig||{});
   applyPanelStyles(d.visualConfig||{});
   frame.style.setProperty('--line-blink-interval',`${Number(d.visualConfig&&d.visualConfig.lineBlinkTempo||2.4)}s`);
   ensurePoll(d.visualConfig&&d.visualConfig.refreshSeconds);
   const textScale=Math.min(1.1,Math.max(.5,Number(d.visualConfig&&d.visualConfig.widgetTextScale||90)/100));
   const titleScale=Math.min(1.3,Math.max(.5,Number(d.visualConfig&&d.visualConfig.widgetTitleScale||100)/100));
   energyEl.style.setProperty('--widget-text-scale',String(textScale));
   energyEl.style.setProperty('--widget-title-scale',String(titleScale));
   const customLabels=d.visualConfig&&d.visualConfig.labels||{};
   document.querySelector('.solar .kicker').textContent=customLabels.solar||tr('widget.solar');
   document.querySelector('.grid .kicker').textContent=customLabels.grid||tr('widget.grid');
   document.querySelector('.battery .kicker').textContent=customLabels.battery||tr('widget.battery');
   document.querySelector('.home .kicker').textContent=customLabels.home||tr('widget.home');
   document.querySelector('.ev .kicker').textContent=customLabels.ev||tr('widget.ev');
   const e=d.energy||{};
   const hasSolar=Number(e.solarCount)>0,hasBattery=Number(e.batteryCount)>0,hasEv=Number(e.evChargerCount)>0;
   document.querySelector('.callout.solar').classList.toggle('component-hidden',!hasSolar);
   document.querySelector('.callout.battery').classList.toggle('component-hidden',!hasBattery);
   document.querySelector('.callout.ev').classList.toggle('component-hidden',!hasEv);
   const showBattery24h=hasBattery && (!d.visualConfig || d.visualConfig.showBattery24h!==false);
   const standbyStyle=value=>['blue','green','greenblue','gray'].includes(String(value||''))?String(value):'blue';
   const solarStandbyLineEnabled=Boolean(d.visualConfig&&d.visualConfig.solarStandbyLineEnabled);
   const solarStandbyLineBlink=Boolean(d.visualConfig&&d.visualConfig.solarStandbyLineBlink);
   const solarStandbyLineStyle=standbyStyle(d.visualConfig&&d.visualConfig.solarStandbyLineStyle||'green');
   const batteryStandbyLineEnabled=!d.visualConfig||d.visualConfig.batteryStandbyLineEnabled!==false;
   const batteryStandbyLineBlink=Boolean(d.visualConfig&&d.visualConfig.batteryStandbyLineBlink);
   const batteryStandbyLineStyle=standbyStyle(d.visualConfig&&d.visualConfig.batteryStandbyLineStyle||'blue');
   const gridStandbyLineEnabled=!d.visualConfig||d.visualConfig.gridStandbyLineEnabled!==false;

   else{$('solarFlowOverlay').setAttribute('class','flow-overlay flow-hidden');}

   const bs=$('batteryStatus');

   if(e.batteryStatusSource==='derived'){if(e.batteryFlow==='charge')status=tr('widget.charging');else if(e.batteryFlow==='discharge')status=tr('widget.discharging');else status=tr('widget.standby');}
   else {const rawStatus=String(status).trim().toLowerCase();if(/^(laden|charging|charge)$/.test(rawStatus))status=tr('widget.charging');else if(/^(ontladen|discharging|discharge)$/.test(rawStatus))status=tr('widget.discharging');else if(/^(stand-by|standby|idle)$/.test(rawStatus))status=tr('widget.standby');}

   const flowSource=e.batteryLineFlow || e.batteryFlow;
  const flowMode=['charge','discharge','idle'].includes(flowSource)?flowSource:'';
   const isCharge=flowMode?flowMode==='charge':/(^|\b)(laden|charging|charge)(\b|$)/.test(statusKey)&&!/(ontladen|discharging|discharge)/.test(statusKey);

   const reverseMotion=typeof e.batteryLineMotionReverse==='boolean' ? e.batteryLineMotionReverse : batteryFlowMode!=='charge';
   if(!hasBattery){

   }else if(batteryFlowMode==='idle'&&batteryStandbyLineEnabled){

   const bp=$('batteryPower');

   }else bp.textContent='';
   bp.className='sub batteryPower '+(isCharge?'power-charge':isDischarge?'power-discharge':'power-idle');

   const gp=e.gridPower&&typeof e.gridPower.rawValue==='number'?e.gridPower.rawValue:null, gridStatus=$('gridStatus'), gridValue=$('gridValue');
   const gridFlow=['import','export','idle'].includes(e.gridFlow)?e.gridFlow:'idle';
   const gridMode=gridFlow==='import'?'grid-import':gridFlow==='export'?'grid-export':'';
   const gridAvailable=Boolean(e.gridPower&&e.gridPower.online);
   if(gridFlow==='idle'&&gridAvailable&&gridStandbyLineEnabled){

   }
   gridStatus.textContent=gp===null?tr('widget.grid_short'):gridFlow==='export'?tr('widget.exporting'):gridFlow==='import'?tr('widget.importing'):tr('widget.grid_short');
   gridStatus.className='sub '+gridMode;gridValue.className='value '+gridMode;
   $('evStatus').textContent=e.evChargerCount>1?tr('widget.chargers',{count:e.evChargerCount}):(e.evStatus&&e.evStatus.online?String(e.evStatus.value):tr('widget.charger'));
   const evCard=document.querySelector('.callout.ev');
   if(evCard){
     const evPower=e.evPower;
     const evWatts=powerToWatts(evPower);
     const evActive=hasEv && evWatts!==null && Math.abs(evWatts)>=50;

   scheduleHeightSync(true);
 }
 async function refresh(){try{render(await Homey.api('GET','/dashboard'));}catch(err){console.error(err);extra.classList.add('hidden');scheduleHeightSync(true);}}
 Homey.on('dashboard.updated',render);
 const ro=new ResizeObserver(()=>scheduleHeightSync());ro.observe(frame);ro.observe(document.body);ro.observe(extra);ro.observe(energyEl);

}
